<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
// a section heading with nothing under it shows N/A; blank table rows are dropped
function markEmpty(root){
  root.querySelectorAll('table').forEach(tb => {
    tb.querySelectorAll('tbody tr').forEach(tr => { if (![...tr.cells].some(c => c.textContent.trim())) tr.remove(); });
    if (!tb.querySelector('tbody tr')) tb.remove();
  });
  [...root.querySelectorAll('h2,h3,h4')].forEach(h => {
    const lvl = +h.tagName[1]; let n = h.nextElementSibling, has = false;
    while (n && !(/^H[1-6]$/.test(n.tagName) && +n.tagName[1] <= lvl)){
      if (!/^H[1-6]$/.test(n.tagName)){ has = true; break; }
      n = n.nextElementSibling;
    }
    if (!has){ const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'N/A'; h.after(p); }
  });
}
</script>
<script src="site.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const id = (q.get('p') || '').replace(/[^a-z0-9_-]/gi, '');
  const view = q.get('view') === 'overview' ? 'overview' : 'log';   // the log is the default view
  const base = 'projects/' + id + '/';
  const content = document.getElementById('content'), side = document.getElementById('side');

  const tabO = document.getElementById('tab-overview'), tabL = document.getElementById('tab-log');
  tabO.href = 'project.html?p=' + id + '&view=overview';
  tabL.href = 'project.html?p=' + id + '&view=log';
  (view === 'log' ? tabL : tabO).setAttribute('aria-current', 'page');

  if (!id){ content.innerHTML = '<p class="empty">No project selected.</p>'; return; }

  const [overview, log] = await Promise.all([Site.load(base + 'overview.md'), Site.load(base + 'log.md')]);

  // page title comes from the first "# " line of overview.md
  const t = overview && overview.match(/^#\s+(.+)$/m);
  const title = t ? t[1].trim() : id;
  document.getElementById('title').textContent = title;
  document.title = title;

  const entries = (log ? Site.parseLog(log) : []).filter(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date));
  if (entries.length){
    const c = document.getElementById('count');
    c.textContent = entries.length; c.hidden = false;
    const latest = entries.find(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date));
    if (latest) document.getElementById('sub').textContent = 'Last updated ' + Site.fmtDate(latest.date);
  }

  if (view === 'overview'){
    if (!overview){ content.innerHTML = '<p class="empty">N/A</p>'; return; }
    const div = document.createElement('div'); div.className = 'md';
    Site.render(overview, base, div);
    markEmpty(div);
    content.replaceChildren(div);
    // sidebar: jump links to each "## " section
    const hs = [...div.querySelectorAll('h2')];
    if (hs.length){
      side.innerHTML = '<h4>Contents</h4><ol></ol>';
      hs.forEach((h, i) => {
        h.id = 's' + (i + 1);
        const li = document.createElement('li'), a = document.createElement('a');
        a.href = '#' + h.id; a.textContent = h.textContent; li.append(a); side.querySelector('ol').append(li);
      });
    }
  } else {
    if (!entries.length){ content.innerHTML = '<p class="empty">N/A</p>'; return; }
    const list = document.createElement('div'); list.className = 'log';
    side.innerHTML = '<h4>Entries</h4><ol></ol>';
    entries.forEach((e, i) => {
      const li = document.createElement('li'), a = document.createElement('a');
      a.href = '#e' + (i + 1);
      a.innerHTML = '<span class="d"></span>'; a.firstChild.textContent = Site.fmtDate(e.date);
      a.append(e.title); li.append(a); side.querySelector('ol').append(li);
    });
    for (const [i, e] of entries.entries()){
      const art = document.createElement('article'); art.className = 'log-entry'; art.id = 'e' + (i + 1);
      const time = document.createElement('time'); time.textContent = Site.fmtDate(e.date); if (e.date) time.dateTime = e.date;
      const col = document.createElement('div'); col.style.minWidth = '0';
      const h = document.createElement('h2'); h.textContent = e.title;
      if (e.author){ const by = document.createElement('span'); by.className = 'by'; by.textContent = e.author; time.append(document.createElement('br'), by); }
      const md = document.createElement('div'); md.className = 'md';
      Site.render(e.body, base, md);
      col.append(h, md); art.append(time, col); list.append(art);
    }
    content.replaceChildren(list);
    if (location.hash){ const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }
})();
</script>
